# Fly.io config for the LearnHarness cloud image (docs/deploy-fly.md).
# `fly launch --copy-config --no-deploy` fills in the app name and region.
app = "learnharness"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LH_MODE = "cloud"
  LH_DATA_DIR = "/data"
  LH_AUTH_FILE = "/data/auth.json"

[[mounts]]
  source = "lh_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (owner choice): background agents and live updates need the
  # machine awake; a sleeping machine would also drop in-flight turns.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/login"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
