# fly.toml app configuration file generated for learnharness on 2026-11-10T03:55:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'learnharness'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  LH_AUTH_FILE = '/data/auth.json'
  LH_DATA_DIR = '/data'
  LH_MODE = 'cloud'

[[mounts]]
  source = 'lh_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
